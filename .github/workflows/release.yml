name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      custom_version:
        description: "Custom version override (format: YYYY.MM.DD.HHMM). Leave blank to use current timestamp."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  prepare-version:
    name: Determine Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute YYYY.MM.DD.HHMM Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            APP_VERSION="${{ github.event.inputs.custom_version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            APP_VERSION="${{ github.ref_name }}"
            APP_VERSION="${APP_VERSION#v}"
          else
            APP_VERSION="$(date -u +'%Y.%m.%d.%H%M')"
          fi

          echo "Calculated Version: ${APP_VERSION}"
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${APP_VERSION}" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android APK
    needs: prepare-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply Version
        run: node scripts/set-version.mjs "${{ needs.prepare-version.outputs.version }}"

      - name: Build Web Assets & Sync Capacitor
        run: npm run build:mobile

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Package & Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/j-title-converter-${{ needs.prepare-version.outputs.version }}.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/*.apk

  build-ios:
    name: Build iOS Package
    needs: prepare-version
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply Version
        run: node scripts/set-version.mjs "${{ needs.prepare-version.outputs.version }}"

      - name: Build Web Assets & Sync Capacitor
        run: npm run build:mobile

      - name: Build Xcode Archive
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcodebuild -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/App.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          else
            xcodebuild -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/App.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          fi

      - name: Package iOS App Bundle
        run: |
          mkdir -p artifacts
          cd build/App.xcarchive/Products/Applications
          zip -r "../../../../artifacts/j-title-converter-${{ needs.prepare-version.outputs.version }}-ios.zip" App.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-package
          path: artifacts/*.zip

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-version, build-android, build-ios]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies & build web distribution
        run: |
          npm ci
          node scripts/set-version.mjs "${{ needs.prepare-version.outputs.version }}"
          npm run build
          mkdir -p release-assets
          tar -czvf "release-assets/j-title-converter-${{ needs.prepare-version.outputs.version }}-web.tar.gz" dist/

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-package
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ needs.prepare-version.outputs.tag }}"
          name: "Release ${{ needs.prepare-version.outputs.version }}"
          body: |
            ## J-Title Converter - Release ${{ needs.prepare-version.outputs.version }}

            ### Downloads
            - **Android APK**: `j-title-converter-${{ needs.prepare-version.outputs.version }}.apk` (Ready to sideload on any Android device)
            - **iOS App Package**: `j-title-converter-${{ needs.prepare-version.outputs.version }}-ios.zip` (Payload for sideloading / AltStore / Sideloadly)
            - **Web Bundle**: `j-title-converter-${{ needs.prepare-version.outputs.version }}-web.tar.gz` (Static web build)

            ### Docker Deployment
            Deploy directly using the included multi-stage Dockerfile:
            ```bash
            docker build -t j-title-converter:${{ needs.prepare-version.outputs.version }} .
            docker run -p 3000:3000 j-title-converter:${{ needs.prepare-version.outputs.version }}
            ```
          files: release-assets/*
          draft: false
          prerelease: false
